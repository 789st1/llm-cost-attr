name: "LLM Cost Attribution"
description: "Scan your codebase for LLM API calls and estimate monthly costs. Fail the build if costs exceed budget."
author: "Suresh Talapaneni"

branding:
  icon: "dollar-sign"
  color: "blue"

inputs:
  path:
    description: "Path to scan (default: current directory)"
    required: false
    default: "."
  budget:
    description: "Monthly cost budget in dollars. Build fails if estimated cost exceeds this."
    required: false
    default: "0"
  volume:
    description: "Estimated monthly invocations"
    required: false
    default: "1000"
  smart:
    description: "Use Gemini AI for improved accuracy (requires gemini-api-key)"
    required: false
    default: "false"
  gemini-api-key:
    description: "Google AI API key for smart mode"
    required: false
  format:
    description: "Output format: terminal, json"
    required: false
    default: "terminal"

outputs:
  total-cost:
    description: "Total estimated monthly cost"
  call-sites:
    description: "Number of LLM call sites found"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run LLM Cost Attribution
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        SCAN_PATH: ${{ inputs.path }}
        SCAN_VOLUME: ${{ inputs.volume }}
        SCAN_BUDGET: ${{ inputs.budget }}
        SCAN_SMART: ${{ inputs.smart }}
        SCAN_FORMAT: ${{ inputs.format }}
      run: |
        SMART_FLAG=""
        if [ "$SCAN_SMART" = "true" ]; then
          SMART_FLAG="--smart"
        fi

        FORMAT_FLAG="-f terminal"
        if [ "$SCAN_FORMAT" = "json" ]; then
          FORMAT_FLAG="-f json"
        fi

        # Run scan once, capture both terminal and JSON output
        npx llm-cost-attr@latest scan "$SCAN_PATH" \
          -v "$SCAN_VOLUME" \
          $FORMAT_FLAG \
          $SMART_FLAG

        # Get cost data for budget check via JSON
        npx llm-cost-attr@latest scan "$SCAN_PATH" \
          -v "$SCAN_VOLUME" \
          -f json \
          -o /tmp/llm-cost-report.json \
          $SMART_FLAG 2>/dev/null || true

        if [ -f /tmp/llm-cost-report.json ]; then
          TOTAL_COST=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/llm-cost-report.json', 'utf8'));
            console.log(typeof r.totalMonthlyCost === 'number' ? r.totalMonthlyCost : 0);
          ")
          CALL_SITES=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/llm-cost-report.json', 'utf8'));
            console.log(typeof r.totalCallSites === 'number' ? r.totalCallSites : 0);
          ")

          echo "total-cost=$TOTAL_COST" >> "$GITHUB_OUTPUT"
          echo "call-sites=$CALL_SITES" >> "$GITHUB_OUTPUT"

          # Budget check with validated numbers
          if [ "$SCAN_BUDGET" != "0" ]; then
            OVER=$(node -e "
              const cost = parseFloat('$TOTAL_COST') || 0;
              const budget = parseFloat(process.env.SCAN_BUDGET) || 0;
              console.log(budget > 0 && cost > budget ? 'true' : 'false');
            ")
            if [ "$OVER" = "true" ]; then
              echo "::error::Estimated monthly LLM cost (\$$TOTAL_COST) exceeds budget (\$$SCAN_BUDGET)"
              exit 1
            else
              echo "LLM cost (\$$TOTAL_COST) is within budget (\$$SCAN_BUDGET)"
            fi
          fi
        fi
